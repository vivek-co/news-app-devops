name: Deploy News App

on:
  push:
    branches: [ feature-1 ]
  pull_request:
    branches: [ feature-1 ]

jobs:
  build-deploy:
    runs-on: self-hosted

    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      APP_NAME: ${{ secrets.APP_NAME }}

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: temurin

    - name: Build with Maven
      run: mvn clean package

    - name: Stop Tomcat
      run: |
        echo "Stopping Tomcat..."
        sudo /opt/tomcat10/bin/shutdown.sh || true
        sleep 5

    - name: Remove old deployment
      run: |
        echo "Removing old ROOT deployment..."
        sudo rm -rf /opt/tomcat10/webapps/ROOT
        sudo rm -f /opt/tomcat10/webapps/ROOT.war

    - name: Deploy new WAR
      run: |
        echo "Deploying new WAR as ROOT..."
        sudo cp target/${APP_NAME}.war /opt/tomcat10/webapps/ROOT.war

    - name: Start Tomcat
      run: |
        echo "Starting Tomcat..."
        sudo /opt/tomcat10/bin/startup.sh
        echo "Waiting for Tomcat to start..."
        for i in {1..15}; do
          RESPONSE=$(curl -s http://${SERVER_IP}:8080/ || true)
          if echo "$RESPONSE" | grep -q "Welcome to news App"; then
            echo "App is live!"
            break
          fi
          echo "Waiting for Tomcat... ($i/15)"
          sleep 10
        done
        echo "Final verification:"
        curl http://${SERVER_IP}:8080/ | grep -E "Welcome to news App|Live News Categories|Top Headlines" || true
